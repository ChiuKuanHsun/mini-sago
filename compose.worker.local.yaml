services:
  worker:
    # Codex 的 Bubblewrap sandbox 需要在容器內建立 user namespace 並掛載。
    # Docker 預設 seccomp 擋掉 unshare(CLONE_NEWUSER)，docker-default 的
    # AppArmor 擋掉 mount，兩者都要放寬。上游 production 是用自訂 seccomp
    # 加專屬 AppArmor profile 達成同樣效果，但那兩份設定沒有隨 repo 附上。
    # cap_drop: ALL 不可行 —— entrypoint 需要 CAP_CHOWN/CAP_SETUID
    # 才能整理 volume 權限並 setpriv 降權到 bun（已實測會失敗）。
    # Codex 的 developer task 是在這個容器裡用 bwrap 跑的 不是丟給 broker
    # 所以這裡沒有上限就等於沒有上限。3g 是給 Codex 加一份 git checkout 的
    # 寬鬆額度 對照聊天模式實測峰值 177MiB。被 OOM kill 會 restart 並在
    # docker inspect 的 RestartCount 留下痕跡 不會安靜地拖垮整台機器。
    mem_limit: 3g
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    environment:
      # 人格文字改成從掛載進來的檔案讀 調語氣不必重建 image。
      MINISAGO_PROMPT_OVERRIDES_DIR: /etc/minisago/prompts
      GIT_AUTHOR_NAME: 二乃
      GIT_AUTHOR_EMAIL: 108409184+ChiuKuanHsun@users.noreply.github.com
      GIT_COMMITTER_NAME: 二乃
      GIT_COMMITTER_EMAIL: 108409184+ChiuKuanHsun@users.noreply.github.com
    volumes:
      - ./prompts-local:/etc/minisago/prompts:ro
    networks:
      default:
      sandbox-internal:
      minisago-edge:

  sandbox:
    # broker 只轉發 Docker API 實測峰值 32MiB
    mem_limit: 256m

networks:
  minisago-edge:
    external: true
